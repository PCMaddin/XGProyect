; php-fpm pool of the game; the number of workers comes from deploy/.env.
; Requests are logged by the web server.
[www]
listen = 9000
pm = static
pm.max_children = ${PHP_FPM_CHILDREN}
pm.max_requests = 1000
ping.path = /ping
request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
access.log = /dev/null
