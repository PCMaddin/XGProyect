; a php-fpm only for the container's self-test (entrypoint.sh): the start
; page is rendered here before the real pool listens on port 9000
[global]
pid = /tmp/php-fpm-selftest.pid
error_log = /proc/self/fd/2
daemonize = yes

[selftest]
listen = 127.0.0.1:9001
pm = static
pm.max_children = 1
clear_env = no
catch_workers_output = yes
