name: PHP Tests

on:
  push:
    branches: '**'
  pull_request:

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.1'
          extensions: gd, mysqli, opcache, zip
          coverage: none

      - name: Ensure lockfile exists
        run: test -f composer.lock

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: composer phpunit

  phpunit-mariadb:
    name: PHPUnit (MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: xgp_test
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      # sessions and cache of several universes in one Redis
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.1'
          extensions: gd, mysqli, pdo_mysql, opcache, zip, redis
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # the tests on MySQL/MariaDB (whole game pages, strict SQL mode)
      - name: Run PHPUnit against MariaDB
        run: vendor/bin/phpunit --filter Mysql
        env:
          MYSQL_TEST_DATABASE: xgp_test
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: 3306
          MYSQL_TEST_USERNAME: root
          MYSQL_TEST_PASSWORD: root
          REDIS_TEST_HOST: 127.0.0.1

  php-cs-fixer:
    name: PHP CS Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.1'
          extensions: gd, mysqli, opcache, zip
          coverage: none

      - name: Ensure lockfile exists
        run: test -f composer.lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --diff --dry-run --verbose

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.1'
          extensions: gd, mysqli, opcache, zip
          coverage: none

      - name: Ensure lockfile exists
        run: test -f composer.lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer phpstan
        env:
          DB_HOST: ''
          DB_PORT: ''
          DB_USERNAME: ''
          DB_PASSWORD: ''
          DB_DATABASE: ''
          DB_PREFIX: ''

  phpmd:
    name: PHPMD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.1'
          extensions: gd, mysqli, opcache, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPMD
        run: vendor/bin/phpmd app/ github phpmd.xml --baseline-file phpmd.baseline.xml

  composer-audit:
    name: Composer Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.1'
          extensions: gd, mysqli, opcache, zip
          coverage: none

      - name: Ensure lockfile exists
        run: test -f composer.lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Audit dependencies for known vulnerabilities
        run: composer audit --locked
